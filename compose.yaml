services:
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_password_dev_only
      KC_HEALTH_ENABLED: "true"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: development
      DEMO_MODE: "true"
      HOST: 0.0.0.0
      PORT: "8000"
      DATABASE_URL: "sqlite:////app/data/tensor_foundry.db"
      OIDC_ISSUER_URL: "http://keycloak:8080/realms/tensor-foundry"
      OIDC_AUDIENCE: tensor-foundry-api
      OIDC_CLIENT_ID: tensor-foundry-client
      OIDC_JWKS_URL: "http://keycloak:8080/realms/tensor-foundry/protocol/openid-connect/certs"
      OIDC_TOKEN_URL: "http://keycloak:8080/realms/tensor-foundry/protocol/openid-connect/token"
      DEMO_JWT_SECRET: local-compose-dev-jwt-secret-not-for-prod
      LLM_API_KEY: ""
      LLM_PROVIDER: openai-compatible
      LLM_MODEL: gpt-4o-mini
      LLM_BASE_URL: "https://api.openai.com/v1"
    volumes:
      - backend-data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  keycloak-data:
  backend-data:
