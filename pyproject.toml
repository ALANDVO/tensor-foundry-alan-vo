[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tensor-foundry-alan-vo"
version = "1.0.0"
description = "Tensors and Dynamic neural networks in Python with strong GPU acceleration, graph compiler, and hardware op coverage triage"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Alan Vo", email = "alanvo@gmail.com" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.27.0",
    "pyjwt>=2.9.0",
    "cryptography>=43.0.0",
    "numpy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
